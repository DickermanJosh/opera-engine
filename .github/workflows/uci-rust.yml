name: Opera Engine UCI CI

on:
  push:
    branches: [ main, develop, uci ]
    paths: 
      - 'rust/**'
      - 'cpp/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'scripts/test_uci_process.py'
      - 'scripts/test_uci_oracle.py'
      - 'scripts/test_uci_client.py'
      - 'scripts/requirements-uci.txt'
      - 'launch.sh'
      - '.github/workflows/uci-rust.yml'
  pull_request:
    branches: [ main, develop ]
    paths: 
      - 'rust/**'
      - 'cpp/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'scripts/test_uci_process.py'
      - 'scripts/test_uci_oracle.py'
      - 'scripts/test_uci_client.py'
      - 'scripts/requirements-uci.txt'
      - 'launch.sh'
      - '.github/workflows/uci-rust.yml'

jobs:
  native-uci:
    name: UCI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            executable: opera-uci
          - os: macos-latest
            cxx: clang++
            executable: opera-uci
          - os: windows-latest
            # The core uses Clang/GCC bit-scan builtins. clang-cl supports these
            # while producing objects compatible with the Rust MSVC target.
            cxx: clang-cl
            executable: opera-uci.exe
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build release UCI executable
        run: cargo +stable build --release --locked --manifest-path rust/Cargo.toml
      - name: Compile all Rust test targets
        run: cargo +stable test --locked --manifest-path rust/Cargo.toml --no-run
      - name: Run Rust library tests
        run: cargo +stable test --locked --manifest-path rust/Cargo.toml --lib
      - name: Run protocol and real-search integration tests
        run: cargo +stable test --locked --manifest-path rust/Cargo.toml --test uci_parser_comprehensive --test uci_handshake_integration --test uci_real_search --test search_integration_tests
      - name: Run bounded process acceptance tests
        run: python scripts/test_uci_process.py rust/target/release/${{ matrix.executable }}
      - name: Install external UCI client
        run: python -m pip install -r scripts/requirements-uci.txt
      - name: Run external client acceptance
        run: python scripts/test_uci_client.py rust/target/release/${{ matrix.executable }}
      - name: Install independent move oracle
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Validate bestmoves and PV against Stockfish
        if: runner.os == 'Linux'
        run: python scripts/test_uci_oracle.py rust/target/release/${{ matrix.executable }} /usr/games/stockfish
      - name: Play timed client acceptance games
        if: runner.os == 'Linux'
        run: python scripts/test_uci_client.py rust/target/release/${{ matrix.executable }} /usr/games/stockfish --pgn rust/target/uci-client-games.pgn
      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: opera-uci-${{ runner.os }}-${{ runner.arch }}
          path: rust/target/release/${{ matrix.executable }}
          if-no-files-found: error

  docker-build-and-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Opera Engine Docker image
      run: |
        echo "🐳 Building Opera Engine Docker image..."
        docker build -t opera-engine .

    - name: Validate the runtime binary in Linux
      run: docker build --target uci-validation -t opera-engine:uci-validation .

    - name: Verify Docker image
      run: |
        echo "✅ Verifying Docker image was built successfully..."
        docker images opera-engine
        docker run --rm opera-engine version

    - name: Run UCI smoke test in container
      run: |
        echo "Running UCI smoke test in Docker container..."
        docker run --rm opera-engine test

    - name: Test clean EOF shutdown
      run: |
        timeout 10s docker run --rm -i opera-engine uci < /dev/null

    - name: Check Docker image size
      run: |
        echo "📦 Checking Docker image size (should be < 300MB)..."
        SIZE=$(docker images opera-engine --format "table {{.Size}}" | tail -1)
        echo "Final image size: $SIZE"
        # Note: Size check is informational for now, will be enforced later
        
